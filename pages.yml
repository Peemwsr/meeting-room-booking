# ขึ้นเว็บบน GitHub Pages อัตโนมัติทุกครั้งที่ push เข้า main (เผยแพร่เฉพาะโฟลเดอร์ web/)
# เปิดใช้: Settings > Pages > Build and deployment > Source = "GitHub Actions"
# หมายเหตุ: ตัวส่งอีเมล (mailer.js) รันบน GitHub Pages ไม่ได้ ต้องรันบนเครื่องอื่น (ดู README)
name: Deploy web to GitHub Pages
on:
  push:
    branches: ["main"]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
